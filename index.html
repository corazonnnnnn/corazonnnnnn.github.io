<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Corazón</title>

    <style>

        body {
            margin: 0;
            background: #dfe8f5;
            font-family: Arial, Helvetica, sans-serif;
            color: #111;
        }

        .barra {
            height: 70px;
            background: #3b5998;
            color: white;

            display: flex;
            align-items: center;

            padding-left: 30px;

            box-sizing: border-box;
        }

        .nombre {
            font-size: 32px;
            font-weight: bold;
        }

        .pagina {
            width: 90%;
            max-width: 1100px;

            margin: 30px auto;
        }

        .perfil {
            background: white;
            border: 1px solid #b7c4d6;

            padding: 20px;

            box-shadow: 0 1px 2px rgba(0,0,0,0.15);
        }

        .perfil h1 {
            margin: 0 0 5px 0;
            font-size: 28px;
        }

        .perfil p {
            margin: 0;
            color: #555;
        }

        .contenido {
            margin-top: 20px;

            background: white;
            border: 1px solid #b7c4d6;

            padding: 20px;
        }

        .titulo {
            font-size: 18px;
            font-weight: bold;

            border-bottom: 1px solid #ddd;

            padding-bottom: 10px;
            margin-bottom: 20px;
        }

    </style>
</head>


<body>

    <div class="barra">
        <div class="nombre">corazón</div>
    </div>


    <div class="pagina">

        <div class="perfil">

            <h1>corazón</h1>

            <p>banda de dream-pop</p>

        </div>


        <div class="contenido">

            <div class="titulo">
                fotos
            </div>

            <p>
                próximamente...
            </p>

        </div>

    </div>

</body>

</html>
