<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>corazón</title>

    <link
        rel="icon"
        type="image/svg+xml"
        href="favicon.svg"
    >

    <style>

        :root {

            --azul-fondo: #c5d2de;
            --azul-suave: #a6b7c7;
            --azul-medio: #879eb3;
            --azul-oscuro: #4b607d;

            --crema: #f5edde;
            --beige: #eadfce;
            --blanco: #fcfaf6;

            --rosa: #d8a1a9;
            --rosa-suave: #edd4d7;

            --verde: #8d9a78;

            --texto: #2e3440;
        }


        * {
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }


        body {

            color: var(--texto);

            font-family:
                "Times New Roman",
                Times,
                serif;

            background-color:
                var(--beige);

            background-image:
                url("fondo-floral.jpg");

            background-size:
                cover;

            background-position:
                center;

            background-repeat:
                no-repeat;

            background-attachment:
                fixed;

            display: flex;

            align-items: center;

            justify-content: center;
        }



        /* PAGINA */

        .pagina {

            width:
                calc(100vw - 30px);

            max-width:
                1500px;

            height:
                calc(100vh - 24px);

            background:
                rgba(234,223,206,0.96);

            border:
                1px solid
                var(--azul-medio);

            box-shadow:
                0 3px 14px
                rgba(75,96,125,0.18);

            position: relative;

            overflow: hidden;
        }


        .pagina::before {

            content: "";

            position: absolute;

            inset: 8px;

            border:
                2px solid
                rgba(75,96,125,0.20);

            pointer-events: none;

            z-index: 20;
        }


        .pagina::after {

            content: "";

            position: absolute;

            inset: 15px;

            border:
                1px solid
                rgba(216,161,169,0.22);

            pointer-events: none;

            z-index: 20;
        }



        /* ESTRUCTURA GENERAL */

        .estructura {

            width: 100%;
            height: 100%;

            display: grid;

            grid-template-columns:
                230px minmax(0, 1fr);

            grid-template-rows:
                minmax(0, 68%)
                minmax(0, 32%);

            position: relative;

            z-index: 1;
        }



        /* COLUMNA IZQUIERDA */

        .sidebar {

            grid-row:
                1 / 3;

            padding:
                28px 20px;

            background:
                linear-gradient(
                    to bottom,
                    rgba(166,183,199,0.16),
                    rgba(234,223,206,0.55)
                );

            border-right:
                4px solid
                var(--azul-oscuro);

            position: relative;

            overflow: hidden;
        }


        .sidebar::after {

            content: "";

            position: absolute;

            top: 16px;
            right: 9px;
            bottom: 16px;

            width: 1px;

            background:
                repeating-linear-gradient(
                    to bottom,
                    rgba(216,161,169,0.45)
                    0 6px,
                    transparent
                    6px 12px
                );
        }


        .logo {

            font-size:
                clamp(27px, 2.1vw, 35px);

            font-weight: bold;

            letter-spacing: 2px;

            margin-bottom: 18px;

            color:
                var(--azul-oscuro);

            line-height: 1;
        }


        .subtitulo {

            font-size:
                clamp(15px, 1.2vw, 19px);

            margin-bottom: 7px;
        }


        .lugar {

            font-size: 14px;

            color:
                #596573;

            margin-bottom: 16px;
        }


        .lineita {

            width: 65px;

            height: 2px;

            background:
                var(--rosa);

            margin:
                14px 0 16px 0;
        }


        .texto-info {

            font-size: 14px;

            line-height: 1.45;

            margin-bottom: 18px;
        }


        /* MENU */

        .menu {

            margin-top: 6px;

            padding:
                12px 12px 7px 12px;

            background:
                rgba(234,223,206,0.45);

            border:
                1px solid
                rgba(135,158,179,0.45);
        }


        .menu a {

            display: block;

            width:
                fit-content;

            margin-bottom:
                8px;

            color:
                var(--azul-oscuro);

            text-decoration:
                underline;

            font-size:
                14px;
        }


        .menu a::before {

            content:
                "♡ ";

            color:
                var(--rosa);
        }



        /* CONTADOR */

        .contador-visitas {

            margin-top:
                20px;

            padding:
                11px 9px;

            text-align:
                center;

            background:
                rgba(234,223,206,0.50);

            border:
                1px solid
                var(--azul-medio);

            box-shadow:
                inset 0 0 0 1px
                rgba(216,161,169,0.18);

            color:
                var(--azul-oscuro);
        }


        .contador-titulo {

            font-size:
                11px;

            letter-spacing:
                1px;

            color:
                var(--rosa);

            margin-bottom:
                4px;
        }


        .contador-texto {

            font-size:
                12px;

            line-height:
                1.4;
        }


        .contador-numero {

            display:
                inline-block;

            margin-top:
                3px;

            font-size:
                20px;

            font-weight:
                bold;

            letter-spacing:
                2px;

            color:
                var(--azul-oscuro);
        }



        /* ACTUALIZACION */

        .actualizacion {

            margin-top:
                18px;

            padding-top:
                10px;

            border-top:
                1px solid
                rgba(75,96,125,0.22);

            font-size:
                11px;

            color:
                #5c6673;
        }


        .firma {

            margin-top:
                14px;

            font-size:
                12px;

            color:
                var(--verde);

            letter-spacing:
                1px;
        }



        /* FOTOS */

        .fotos {

            position:
                relative;

            display:
                grid;

            grid-template-columns:
                repeat(6, minmax(0, 1fr));

            grid-template-rows:
                repeat(3, minmax(0, 1fr));

            gap:
                7px;

            padding:
                49px 15px 13px 15px;

            min-width:
                0;

            min-height:
                0;

            background:
                linear-gradient(
                    to bottom,
                    rgba(166,183,199,0.09),
                    rgba(234,223,206,0.35)
                );

            border-bottom:
                4px solid
                var(--azul-oscuro);

            overflow:
                visible;
        }


        .fotos::before {

            content: "";

            position:
                absolute;

            left:
                20px;

            right:
                20px;

            top:
                18px;

            height:
                1px;

            background:
                repeating-linear-gradient(
                    to right,
                    rgba(141,154,120,0.65)
                    0 6px,
                    transparent
                    6px 12px
                );
        }


        .titulo-fotos {

            position:
                absolute;

            top:
                25px;

            left:
                24px;

            font-size:
                16px;

            letter-spacing:
                1px;

            color:
                var(--azul-oscuro);

            background:
                rgba(234,223,206,0.92);

            padding-right:
                7px;

            z-index:
                10;
        }


        .titulo-fotos::after {

            content:
                "  ♡";

            color:
                var(--rosa);
        }



        /* FOTOS */

        .foto {

            position:
                relative;

            min-width:
                0;

            min-height:
                0;

            width:
                100%;

            height:
                100%;

            padding:
                3px;

            background:
                var(--crema);

            border:
                2px solid
                var(--azul-oscuro);

            box-shadow:
                0 2px 5px
                rgba(75,96,125,0.13);

            cursor:
                pointer;

            overflow:
                hidden;

            transition:
                transform 0.20s ease,
                box-shadow 0.20s ease;

            z-index:
                1;
        }


        .foto img {

            width:
                100%;

            height:
                100%;

            display:
                block;

            object-fit:
                cover;

            object-position:
                center;
        }


        .foto:hover {

            transform:
                scale(2);

            z-index:
                100;

            box-shadow:
                0 10px 30px
                rgba(75,96,125,0.38);

            border:
                2px solid
                var(--azul-oscuro);
        }


        .foto:nth-child(6n + 2) {

            transform-origin:
                left center;
        }


        .foto:nth-child(6n + 1) {

            transform-origin:
                right center;
        }



        /* PARTE INFERIOR */

        .abajo {

            display:
                grid;

            grid-template-columns:
                1fr 1fr;

            min-width:
                0;

            min-height:
                0;

            height:
                100%;
        }


        .musica,
        .guestbook {

            min-width:
                0;

            min-height:
                0;

            padding:
                24px 22px 20px 22px;

            background:
                rgba(234,223,206,0.40);

            position:
                relative;

            overflow:
                hidden;
        }


        .musica {

            border-right:
                4px solid
                var(--azul-oscuro);
        }


        .musica::before,
        .guestbook::before {

            content: "";

            position:
                absolute;

            top:
                11px;

            left:
                15px;

            right:
                15px;

            height:
                1px;

            background:
                linear-gradient(
                    to right,
                    rgba(216,161,169,0.4),
                    rgba(141,154,120,0.35),
                    rgba(216,161,169,0.4)
                );
        }


        .musica h2,
        .guestbook h2 {

            margin:
                2px 0 10px 0;

            font-size:
                16px;

            font-weight:
                normal;

            letter-spacing:
                1px;

            color:
                var(--azul-oscuro);
        }


        .musica h2::after,
        .guestbook h2::after {

            content:
                "  ♡";

            color:
                var(--rosa);

            font-size:
                14px;
        }



        /* SOUNDCLOUD */

        .reproductor {

            width:
                100%;

            height:
                calc(100% - 30px);

            padding:
                7px;

            border:
                2px solid
                var(--azul-medio);

            background:
                linear-gradient(
                    to bottom,
                    rgba(166,183,199,0.14),
                    rgba(234,223,206,0.50)
                );

            overflow:
                hidden;
        }


        .reproductor iframe {

            display:
                block;

            width:
                100%;

            height:
                100%;

            border:
                0;
        }



        /* LIBRO DE QUEJAS */

        .guestbook-contenido {

            height:
                calc(100% - 30px);

            display:
                grid;

            grid-template-columns:
                43% 57%;

            gap:
                10px;

            min-height:
                0;
        }


        .form-queja {

            border:
                2px solid
                var(--azul-medio);

            background:
                rgba(234,223,206,0.45);

            padding:
                10px;

            min-height:
                0;
        }


        .form-queja label {

            display:
                block;

            font-size:
                12px;

            margin-bottom:
                3px;

            color:
                var(--azul-oscuro);
        }


        .form-queja input,
        .form-queja textarea {

            width:
                100%;

            border:
                1px solid
                var(--azul-medio);

            background:
                rgba(245,237,222,0.92);

            font-family:
                "Times New Roman",
                Times,
                serif;

            font-size:
                12px;

            color:
                var(--texto);

            padding:
                5px;

            outline:
                none;
        }


        .form-queja input {

            margin-bottom:
                7px;
        }


        .form-queja textarea {

            height:
                55px;

            resize:
                none;

            margin-bottom:
                6px;
        }


        .form-queja button {

            border:
                1px solid
                var(--azul-oscuro);

            background:
                var(--crema);

            color:
                var(--azul-oscuro);

            font-family:
                "Times New Roman",
                Times,
                serif;

            font-size:
                12px;

            padding:
                5px 10px;

            cursor:
                pointer;
        }


        .form-queja button:hover {

            background:
                var(--rosa-suave);
        }


        .estado {

            font-size:
                11px;

            margin-top:
                6px;

            min-height:
                14px;

            color:
                var(--verde);
        }



        /* MENSAJES */

        .lista-mensajes {

            border:
                2px solid
                var(--azul-medio);

            background:
                linear-gradient(
                    to bottom,
                    rgba(237,212,215,0.18),
                    rgba(234,223,206,0.40)
                );

            padding:
                9px 11px;

            overflow-y:
                auto;

            min-height:
                0;
        }


        .mensaje {

            padding:
                5px 2px 7px 2px;

            border-bottom:
                1px dotted
                rgba(75,96,125,0.40);

            font-size:
                12px;
        }


        .mensaje:last-child {

            border-bottom:
                none;
        }


        .mensaje-cabecera {

            display:
                flex;

            justify-content:
                space-between;

            gap:
                7px;

            margin-bottom:
                3px;
        }


        .mensaje-nombre {

            font-weight:
                bold;

            color:
                var(--azul-oscuro);
        }


        .mensaje-fecha {

            color:
                #777;

            font-size:
                10px;

            white-space:
                nowrap;
        }


        .mensaje-texto {

            line-height:
                1.3;

            overflow-wrap:
                anywhere;
        }


        .sin-mensajes {

            font-size:
                12px;

            color:
                #777;

            font-style:
                italic;
        }



        /* CURSOR */

        @media (pointer: fine) {

            body,
            a,
            button,
            input,
            textarea,
            .foto {

                cursor:
                    none !important;
            }


            .cursor-corazon {

                position:
                    fixed;

                width:
                    28px;

                height:
                    28px;

                left:
                    0;

                top:
                    0;

                pointer-events:
                    none;

                z-index:
                    999999;

                transform:
                    translate(-4px,-4px);

                image-rendering:
                    pixelated;
            }


            .cursor-corazon svg {

                display:
                    block;

                width:
                    100%;

                height:
                    100%;

                image-rendering:
                    pixelated;
            }


            .estela-cursor {

                position:
                    fixed;

                width:
                    6px;

                height:
                    6px;

                pointer-events:
                    none;

                z-index:
                    999998;

                animation:
                    desaparecer-estela
                    0.7s linear forwards;
            }


            @keyframes desaparecer-estela {

                0% {

                    opacity:
                        0.95;

                    transform:
                        translate(-50%,-50%)
                        scale(1);
                }


                70% {

                    opacity:
                        0.45;
                }


                100% {

                    opacity:
                        0;

                    transform:
                        translate(-50%,12px)
                        scale(0.3);
                }

            }

        }



        /* CELULAR */

        @media
        (max-width: 650px) {

            html,
            body {

                height:
                    auto;

                overflow-y:
                    auto;
            }


            body {

                display:
                    block;

                background-size:
                    auto 100%;
            }


            .pagina {

                width:
                    96%;

                height:
                    auto;

                margin:
                    10px auto;

                overflow:
                    hidden;
            }


            .estructura {

                display:
                    block;

                height:
                    auto;
            }


            .sidebar {

                border-right:
                    none;

                border-bottom:
                    4px solid
                    var(--azul-oscuro);
            }


            .sidebar::after {

                display:
                    none;
            }


            .fotos {

                min-height:
                    auto;

                grid-template-columns:
                    repeat(2,1fr);

                grid-template-rows:
                    none;

                padding:
                    52px 10px 12px 10px;

                overflow:
                    hidden;
            }


            .foto {

                aspect-ratio:
                    1 / 1;
            }


            .foto:hover {

                transform:
                    scale(1.05);
            }


            .abajo {

                display:
                    block;
            }


            .musica {

                border-right:
                    none;

                border-bottom:
                    4px solid
                    var(--azul-oscuro);

                height:
                    280px;
            }


            .guestbook {

                height:
                    auto;

                min-height:
                    430px;
            }


            .guestbook-contenido {

                display:
                    block;

                height:
                    auto;
            }


            .form-queja {

                margin-bottom:
                    10px;
            }


            .lista-mensajes {

                height:
                    220px;
            }

        }

    </style>

</head>



<body>

        <div class="estructura">



            <aside class="sidebar">


                <div class="logo">
                    corazón
                </div>


                <div class="subtitulo">
                    banda de crotitos
                </div>


                <div class="lugar">
                    villa maría, argentina
                </div>


                <div class="lineita"></div>


                <div class="texto-info">

                    música, imágenes y otras cosas

                </div>


                <div class="menu">

                    <a href="#">
                        inicio
                    </a>

                    <a href="#fotos">
                        fotos
                    </a>

                    <a href="#musica">
                        música
                    </a>

                    <a href="#guestbook">
                        libro de quejas
                    </a>

                    <a href="#">
                        contacto
                    </a>

                </div>



                <div class="contador-visitas">

                    <div class="contador-titulo">

                        ✧ FELICIDADES ✧

                    </div>


                    <div class="contador-texto">

                        SOS LA VISITA NÚMERO

                        <br>

                        <span
                            class="contador-numero"
                            id="numeroVisitas"
                        >
                            ...
                        </span>

                        <br>

                        ♡

                    </div>

                </div>



                <div class="actualizacion">

                    última actualización:

                    <br>

                    17.09.2026

                </div>


                <div class="firma">

                    gracias por pasar

                </div>


            </aside>



            <section
                class="fotos"
                id="fotos"
            >


                <div class="titulo-fotos">

                    fotos

                </div>


                <div class="foto">
                    <img src="fotos/fotocamarita1.JPG" alt="Corazón 1">
                </div>

                <div class="foto">
                    <img src="fotos/fotocamarita2.JPG" alt="Corazón 2">
                </div>

                <div class="foto">
                    <img src="fotos/fotocamarita3.JPG" alt="Corazón 3">
                </div>

                <div class="foto">
                    <img src="fotos/fotocamarita4.JPG" alt="Corazón 4">
                </div>

                <div class="foto">
                    <img src="fotos/fotocamarita5.JPG" alt="Corazón 5">
                </div>

                <div class="foto">
                    <img src="fotos/fotocamarita6.JPG" alt="Corazón 6">
                </div>

                <div class="foto">
                    <img src="fotos/fotocamarita7.JPG" alt="Corazón 7">
                </div>

                <div class="foto">
                    <img src="fotos/fotocamarita8.JPG" alt="Corazón 8">
                </div>

                <div class="foto">
                    <img src="fotos/fotocamarita9.JPG" alt="Corazón 9">
                </div>

                <div class="foto">
                    <img src="fotos/fotocamarita10.JPG" alt="Corazón 10">
                </div>

                <div class="foto">
                    <img src="fotos/fotocamarita11.JPG" alt="Corazón 11">
                </div>

                <div class="foto">

                </div>

                <div class="foto">

                <div class="foto">

                </div>

                <div class="foto">
                    <img src="fotos/fotocamarita15.JPG" alt="Corazón 15">
                </div>

                <div class="foto">
                    <img src="fotos/fotocamarita16.JPG" alt="Corazón 16">
                </div>

                <div class="foto">
                    <img src="fotos/fotocamarita17.JPG" alt="Corazón 17">
                </div>

                <div class="foto">
                    <img src="fotos/fotocamarita18.JPG" alt="Corazón 18">
                </div>

            <section class="abajo">



                <div

                    <h2>

                    <div class="reproductor">

                        <iframe

                            scrolling="no"

                            frameborder="no"

                            allow="autoplay"

                            src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/corazon-942052517/sets/a6d07793-2ccc-40c3-a9f0-960546723608&color=%234b607d&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false"

                            <textarea

                                maxlength="250"
                                required
                                placeholder="escribí algo..."

                            <button
                                type="submit"
                                id="botonEnviar"

                                dejar queja ♡

                                class="estado"
                                id="estado"

                        </form>



                        <div
                            class="lista-mensajes"
                            id="listaMensajes"

                                cargando quejas...

                            </div>


                        </div>


                    </div>


                </div>


            </section>


        </div>


    </div>



    <!-- CURSOR -->

    <div
        class="cursor-corazon"
        id="cursorCorazon"
    >

        <svg
            viewBox="0 0 8 8"
            xmlns="http://www.w3.org/2000/svg"
            shape-rendering="crispEdges"
        >

            <rect x="1" y="1" width="2" height="1" fill="#d8a1a9"/>
            <rect x="5" y="1" width="2" height="1" fill="#d8a1a9"/>

            <rect x="0" y="2" width="8" height="2" fill="#d8a1a9"/>

            <rect x="1" y="4" width="6" height="1" fill="#d8a1a9"/>
            <rect x="2" y="5" width="4" height="1" fill="#d8a1a9"/>
            <rect x="3" y="6" width="2" height="1" fill="#d8a1a9"/>

            <rect x="1" y="2" width="1" height="1" fill="#f5edde"/>

            <rect x="1" y="0" width="2" height="1" fill="#4b607d"/>
            <rect x="5" y="0" width="2" height="1" fill="#4b607d"/>

            <rect x="0" y="1" width="1" height="1" fill="#4b607d"/>
            <rect x="3" y="1" width="2" height="1" fill="#4b607d"/>
            <rect x="7" y="1" width="1" height="1" fill="#4b607d"/>

            <rect x="0" y="4" width="1" height="1" fill="#4b607d"/>
            <rect x="7" y="4" width="1" height="1" fill="#4b607d"/>

            <rect x="1" y="5" width="1" height="1" fill="#4b607d"/>
            <rect x="6" y="5" width="1" height="1" fill="#4b607d"/>

            <rect x="2" y="6" width="1" height="1" fill="#4b607d"/>
            <rect x="5" y="6" width="1" height="1" fill="#4b607d"/>

            <rect x="3" y="7" width="2" height="1" fill="#4b607d"/>

        </svg>

    </div>



    <!-- SUPABASE -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>



    <script>

        const SUPABASE_URL =
            "https://zrilfkbfamqalnhivrbi.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_mcPUeS82W0XCNciGy6KAEA_qVm7P8sG";


        const clienteSupabase =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );



        /* CONTADOR */

        async function actualizarContador() {

            const elemento =
                document.getElementById(
                    "numeroVisitas"
                );


            const ahora =
                Date.now();


            const ultimaVisita =
                localStorage.getItem(
                    "corazon_ultima_visita"
                );


            const unDia =
                24 * 60 * 60 * 1000;


            if (
                !ultimaVisita ||
                ahora - Number(ultimaVisita) > unDia
            ) {

                const {
                    data,
                    error
                } =
                    await clienteSupabase
                        .rpc(
                            "incrementar_visitas"
                        );


                if (!error) {

                    elemento.textContent =
                        data;


                    localStorage.setItem(
                        "corazon_ultima_visita",
                        ahora.toString()
                    );


                    return;

                }

            }



            const {
                data,
                error
            } =
                await clienteSupabase

                    .from("visitas")

                    .select("contador")

                    .eq("id",1)

                    .single();


            if (error) {

                elemento.textContent =
                    "?";

                return;

            }


            elemento.textContent =
                data.contador;

        }



        /* LIBRO DE QUEJAS */

        const formQueja =
            document.getElementById(
                "formQueja"
            );


        const inputNombre =
            document.getElementById(
                "nombre"
            );


        const inputMensaje =
            document.getElementById(
                "mensaje"
            );


        const listaMensajes =
            document.getElementById(
                "listaMensajes"
            );


        const estado =
            document.getElementById(
                "estado"
            );


        const botonEnviar =
            document.getElementById(
                "botonEnviar"
            );



        async function cargarMensajes() {

            listaMensajes.innerHTML =
                '<div class="sin-mensajes">cargando quejas...</div>';


            const {
                data,
                error
            } =
                await clienteSupabase

                    .from("mensajes")

                    .select(
                        "id, nombre, mensaje, created_at"
                    )

                    .order(
                        "created_at",
                        {
                            ascending:
                                false
                        }
                    )

                    .limit(50);


            if (error) {

                listaMensajes.innerHTML =
                    '<div class="sin-mensajes">no se pudieron cargar las quejas :(</div>';

                return;

            }


            listaMensajes.innerHTML =
                "";


            if (
                !data ||
                data.length === 0
            ) {

                listaMensajes.innerHTML =
                    '<div class="sin-mensajes">todavía nadie se quejó. sospechoso...</div>';

                return;

            }



            data.forEach(
                (item) => {


                    const bloque =
                        document.createElement(
                            "div"
                        );


                    bloque.className =
                        "mensaje";


                    const cabecera =
                        document.createElement(
                            "div"
                        );


                    cabecera.className =
                        "mensaje-cabecera";


                    const nombre =
                        document.createElement(
                            "span"
                        );


                    nombre.className =
                        "mensaje-nombre";


                    nombre.textContent =
                        item.nombre ||
                        "anónimo";


                    const fecha =
                        document.createElement(
                            "span"
                        );


                    fecha.className =
                        "mensaje-fecha";


                    const fechaReal =
                        new Date(
                            item.created_at
                        );


                    fecha.textContent =
                        fechaReal.toLocaleDateString(
                            "es-AR",
                            {
                                day:
                                    "2-digit",

                                month:
                                    "2-digit",

                                year:
                                    "2-digit"
                            }
                        );


                    const texto =
                        document.createElement(
                            "div"
                        );


                    texto.className =
                        "mensaje-texto";


                    texto.textContent =
                        item.mensaje;


                    cabecera.appendChild(
                        nombre
                    );


                    cabecera.appendChild(
                        fecha
                    );


                    bloque.appendChild(
                        cabecera
                    );


                    bloque.appendChild(
                        texto
                    );


                    listaMensajes.appendChild(
                        bloque
                    );

                }
            );

        }



        formQueja.addEventListener(

            "submit",

            async (evento) => {


                evento.preventDefault();


                let nombre =
                    inputNombre
                    .value
                    .trim();


                const mensaje =
                    inputMensaje
                    .value
                    .trim();


                if (!mensaje) {

                    estado.textContent =
                        "tenés que escribir algo";

                    return;

                }


                if (!nombre) {

                    nombre =
                        "anónimo";

                }


                botonEnviar.disabled =
                    true;


                estado.textContent =
                    "publicando...";


                const {
                    error
                } =
                    await clienteSupabase

                        .from("mensajes")

                        .insert([
                            {
                                nombre:
                                    nombre,

                                mensaje:
                                    mensaje
                            }
                        ]);


                botonEnviar.disabled =
                    false;


                if (error) {

                    estado.textContent =
                        "no se pudo publicar :(";

                    return;

                }


                inputMensaje.value =
                    "";


                estado.textContent =
                    "queja publicada ♡";


                await cargarMensajes();


                setTimeout(
                    () => {

                        estado.textContent =
                            "";

                    },

                    2500
                );

            }
        );



        /* CURSOR */

        const cursorCorazon =
            document.getElementById(
                "cursorCorazon"
            );


        const coloresEstela = [

            "#d8a1a9",
            "#879eb3",
            "#8d9a78",
            "#f5edde",
            "#a6b7c7"

        ];


        let ultimoRastro =
            0;


        document.addEventListener(

            "mousemove",

            (evento) => {


                cursorCorazon.style.left =
                    evento.clientX +
                    "px";


                cursorCorazon.style.top =
                    evento.clientY +
                    "px";


                const ahora =
                    Date.now();


                if (
                    ahora -
                    ultimoRastro <
                    35
                ) {

                    return;

                }


                ultimoRastro =
                    ahora;


                const pixel =
                    document.createElement(
                        "div"
                    );


                pixel.className =
                    "estela-cursor";


                pixel.style.left =
                    evento.clientX +
                    "px";


                pixel.style.top =
                    evento.clientY +
                    "px";


                const color =
                    coloresEstela[
                        Math.floor(
                            Math.random() *
                            coloresEstela.length
                        )
                    ];


                pixel.style.background =
                    color;


                pixel.style.marginLeft =
                    (
                        Math.random() *
                        10 -
                        5
                    ) +
                    "px";


                pixel.style.marginTop =
                    (
                        Math.random() *
                        10 -
                        5
                    ) +
                    "px";


                document.body.appendChild(
                    pixel
                );


                setTimeout(
                    () => {

                        pixel.remove();

                    },

                    700
                );

            }
        );



        document.addEventListener(

            "mouseleave",

            () => {

                cursorCorazon.style.display =
                    "none";

            }
        );


        document.addEventListener(

            "mouseenter",

            () => {

                cursorCorazon.style.display =
                    "block";

            }
        );



        /* ARRANQUE */

        actualizarContador();

        cargarMensajes();


    </script>


</body>

</html>
