<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>corazón</title>

    <style>
        :root {
            --azul-fondo: #c5d2de;
            --azul-suave: #a6b7c7;
            --azul-medio: #879eb3;
            --azul-oscuro: #4b607d;

            --crema: #f5edde;
            --beige: #eadfce;
            --blanco: #fcfaf6;

            --rosa: #d8a1a9;
            --rosa-suave: #edd4d7;

            --verde: #8d9a78;
            --texto: #2e3440;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: var(--texto);
            font-family: "Times New Roman", Times, serif;

            background-color: var(--beige);

            background-image:
                radial-gradient(
                    rgba(255,255,255,0.28) 1px,
                    transparent 1px
                ),
                radial-gradient(
                    rgba(75,96,125,0.06) 1px,
                    transparent 1px
                );

            background-size: 18px 18px;
            background-position: 0 0, 9px 9px;
        }

        .pagina {
            width: 95%;
            max-width: 1200px;
            margin: 24px auto;

            background: rgba(252,250,246,0.92);

            border: 1px solid var(--azul-medio);

            box-shadow:
                0 3px 12px rgba(75,96,125,0.15);

            position: relative;
            overflow: hidden;
        }

        .pagina::before {
            content: "";
            position: absolute;
            inset: 10px;

            border:
                2px solid rgba(75,96,125,0.20);

            pointer-events: none;
        }

        .pagina::after {
            content: "";
            position: absolute;
            inset: 18px;

            border:
                1px solid rgba(216,161,169,0.22);

            pointer-events: none;
        }


        /* ESTRUCTURA PRINCIPAL */

        .estructura {
            display: grid;

            grid-template-columns:
                240px 1fr;

            grid-template-rows:
                850px 280px;

            min-height: 1130px;

            position: relative;
            z-index: 1;
        }


        /* COLUMNA IZQUIERDA */

        .sidebar {
            grid-row: 1 / 3;

            padding:
                30px 22px;

            background:
                linear-gradient(
                    to bottom,
                    rgba(166,183,199,0.18),
                    rgba(245,237,222,0.42)
                );

            border-right:
                4px solid var(--azul-oscuro);

            position: relative;
        }

        .sidebar::after {
            content: "";

            position: absolute;

            top: 18px;
            right: 10px;
            bottom: 18px;

            width: 1px;

            background:
                repeating-linear-gradient(
                    to bottom,
                    rgba(216,161,169,0.45) 0 6px,
                    transparent 6px 12px
                );
        }

        .logo {
            font-size: 35px;
            font-weight: bold;
            letter-spacing: 2px;

            margin-bottom: 18px;

            color: var(--azul-oscuro);

            line-height: 1;
        }

        .subtitulo {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .lugar {
            font-size: 16px;
            color: #596573;
            margin-bottom: 20px;
        }

        .lineita {
            width: 70px;
            height: 2px;

            background: var(--rosa);

            margin:
                16px 0 18px 0;
        }

        .texto-info {
            font-size: 16px;
            line-height: 1.55;
            margin-bottom: 24px;
        }

        .menu {
            margin-top: 8px;

            padding:
                14px 14px 10px 14px;

            background:
                rgba(255,255,255,0.35);

            border:
                1px solid rgba(135,158,179,0.45);
        }

        .menu a {
            display: block;
            width: fit-content;

            margin-bottom: 10px;

            color: var(--azul-oscuro);

            text-decoration: underline;

            font-size: 17px;
        }

        .menu a::before {
            content: "♡ ";
            color: var(--rosa);
        }

        .actualizacion {
            margin-top: 28px;

            padding-top: 14px;

            border-top:
                1px solid rgba(75,96,125,0.22);

            font-size: 13px;

            color: #5c6673;
        }

        .firma {
            margin-top: 22px;

            font-size: 13px;

            color: var(--verde);

            letter-spacing: 1px;
        }


        /* ZONA DE FOTOS */

        .fotos {
            position: relative;

            display: grid;

            grid-template-columns:
                repeat(6, 1fr);

            grid-template-rows:
                repeat(3, 1fr);

            gap: 8px;

            padding:
                65px 18px 18px 18px;

            min-height: 850px;

            background:
                linear-gradient(
                    to bottom,
                    rgba(166,183,199,0.11),
                    rgba(245,237,222,0.12)
                );

            border-bottom:
                4px solid var(--azul-oscuro);

            overflow: visible;
        }

        .fotos::before {
            content: "";

            position: absolute;

            left: 24px;
            right: 24px;
            top: 24px;

            height: 1px;

            background:
                repeating-linear-gradient(
                    to right,
                    rgba(141,154,120,0.65) 0 6px,
                    transparent 6px 12px
                );
        }

        .titulo-fotos {
            position: absolute;

            top: 34px;
            left: 30px;

            font-size: 19px;
            letter-spacing: 1px;

            color: var(--azul-oscuro);

            background:
                rgba(252,250,246,0.88);

            padding-right: 8px;

            z-index: 10;
        }

        .titulo-fotos::after {
            content: "  ♡";

            color: var(--rosa);

            font-size: 16px;
        }


        /* FOTOS NORMALES */

        .foto {
            position: relative;

            width: 100%;
            height: 100%;

            min-width: 0;
            min-height: 0;

            padding: 4px;

            background: var(--blanco);

            border:
                2px solid var(--azul-oscuro);

            box-shadow:
                0 2px 6px rgba(75,96,125,0.13);

            cursor: pointer;

            overflow: hidden;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;

            z-index: 1;
        }

        .foto img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;
            object-position: center;
        }


        /* FOTO AGRANDADA AL PASAR EL MOUSE */

      .foto:hover {
    transform: scale(2);

    aspect-ratio: 1 / 1;

    z-index: 100;

    overflow: hidden;

    box-shadow:
        0 10px 30px rgba(75,96,125,0.40);

    border:
        2px solid var(--azul-oscuro);
}

        /* ZONA INFERIOR */

        .abajo {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            height: 100%;
        }

        .musica,
        .guestbook {
            padding: 34px;

            background:
                rgba(245,237,222,0.28);

            position: relative;
        }

        .musica {
            border-right:
                4px solid var(--azul-oscuro);
        }

        .musica::before,
        .guestbook::before {
            content: "";

            position: absolute;

            top: 18px;
            left: 18px;
            right: 18px;

            height: 1px;

            background:
                linear-gradient(
                    to right,
                    rgba(216,161,169,0.4),
                    rgba(141,154,120,0.35),
                    rgba(216,161,169,0.4)
                );
        }

        .musica h2,
        .guestbook h2 {
            margin:
                6px 0 20px 0;

            font-size: 19px;

            font-weight: normal;

            letter-spacing: 1px;

            color: var(--azul-oscuro);
        }

        .musica h2::after,
        .guestbook h2::after {
            content: "  ♡";

            color: var(--rosa);

            font-size: 16px;
        }

        .reproductor,
        .mensajes {
            min-height: 132px;

            padding: 22px;

            background:
                rgba(255,255,255,0.45);

            border:
                2px solid var(--azul-medio);

            box-shadow:
                inset 0 0 0 1px rgba(255,255,255,0.35);

            font-size: 17px;
            line-height: 1.5;

            position: relative;
        }

        .reproductor {
            background:
                linear-gradient(
                    to bottom,
                    rgba(166,183,199,0.18),
                    rgba(245,237,222,0.2)
                );
        }

        .mensajes {
            background:
                linear-gradient(
                    to bottom,
                    rgba(237,212,215,0.14),
                    rgba(245,237,222,0.18)
                );
        }

        .reproductor::after,
        .mensajes::after {
            content: "✿";

            position: absolute;

            right: 12px;
            bottom: 8px;

            font-size: 16px;

            color:
                rgba(141,154,120,0.65);
        }


        /* CELULAR */

        @media (max-width: 700px) {

            .pagina {
                width: 96%;
                margin: 12px auto;
            }

            .estructura {
                display: block;
                min-height: auto;
            }

            .sidebar {
                border-right: none;

                border-bottom:
                    4px solid var(--azul-oscuro);
            }

            .sidebar::after {
                display: none;
            }

            .fotos {
                min-height: auto;

                grid-template-columns:
                    repeat(2, 1fr);

                grid-template-rows:
                    none;

                gap: 8px;

                padding:
                    65px 10px 15px 10px;

                overflow: hidden;
            }

            .foto {
                aspect-ratio: 1 / 1;
            }

            /* En celular evitamos el aumento x3 */
            .foto:hover {
                transform: scale(1.05);
                aspect-ratio: 1 / 1;
            }

            .abajo {
                display: block;
            }

            .musica {
                border-right: none;

                border-bottom:
                    4px solid var(--azul-oscuro);
            }
        }

    </style>
</head>


<body>
