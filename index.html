<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>corazón</title>

    <style>

        :root {

            --azul-fondo: #c5d2de;
            --azul-suave: #a6b7c7;
            --azul-medio: #879eb3;
            --azul-oscuro: #4b607d;

            --crema: #f5edde;
            --beige: #eadfce;
            --blanco: #fcfaf6;

            --rosa: #d8a1a9;
            --rosa-suave: #edd4d7;

            --verde: #8d9a78;

            --texto: #2e3440;
        }


        * {
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;

            overflow: hidden;
        }


        body {

            color: var(--texto);

            font-family:
                "Times New Roman",
                Times,
                serif;

            background-color:
                var(--beige);

            background-image:

                radial-gradient(
                    rgba(255,255,255,0.30) 1px,
                    transparent 1px
                ),

                radial-gradient(
                    rgba(75,96,125,0.06) 1px,
                    transparent 1px
                );

            background-size:
                18px 18px;

            background-position:
                0 0,
                9px 9px;

            display: flex;

            align-items: center;
            justify-content: center;
        }



        /* ======================================== */
        /* PAGINA COMPLETA                          */
        /* ======================================== */

        .pagina {

            width: calc(100vw - 30px);

            max-width: 1500px;

            height: calc(100vh - 24px);

            background:
                rgba(252,250,246,0.94);

            border:
                1px solid var(--azul-medio);

            box-shadow:
                0 3px 14px
                rgba(75,96,125,0.18);

            position: relative;

            overflow: hidden;
        }


        /* MARCO INTERIOR AZUL */

        .pagina::before {

            content: "";

            position: absolute;

            inset: 8px;

            border:
                2px solid
                rgba(75,96,125,0.20);

            pointer-events: none;

            z-index: 20;
        }


        /* MARCO INTERIOR ROSA */

        .pagina::after {

            content: "";

            position: absolute;

            inset: 15px;

            border:
                1px solid
                rgba(216,161,169,0.22);

            pointer-events: none;

            z-index: 20;
        }



        /* ======================================== */
        /* ESTRUCTURA GENERAL                       */
        /* ======================================== */

        .estructura {

            width: 100%;
            height: 100%;

            display: grid;

            grid-template-columns:
                230px minmax(0, 1fr);

            grid-template-rows:
                minmax(0, 72%) minmax(0, 28%);

            position: relative;

            z-index: 1;
        }



        /* ======================================== */
        /* COLUMNA IZQUIERDA                        */
        /* ======================================== */

        .sidebar {

            grid-row:
                1 / 3;

            padding:
                28px 20px;

            background:

                linear-gradient(
                    to bottom,
                    rgba(166,183,199,0.18),
                    rgba(245,237,222,0.42)
                );

            border-right:
                4px solid
                var(--azul-oscuro);

            position: relative;

            overflow: hidden;
        }


        .sidebar::after {

            content: "";

            position: absolute;

            top: 16px;
            right: 9px;
            bottom: 16px;

            width: 1px;

            background:

                repeating-linear-gradient(

                    to bottom,

                    rgba(216,161,169,0.45)
                    0 6px,

                    transparent
                    6px 12px

                );
        }


        .logo {

            font-size:
                clamp(27px, 2.1vw, 35px);

            font-weight: bold;

            letter-spacing: 2px;

            margin-bottom: 18px;

            color:
                var(--azul-oscuro);

            line-height: 1;
        }


        .subtitulo {

            font-size:
                clamp(15px, 1.2vw, 19px);

            margin-bottom: 7px;
        }


        .lugar {

            font-size: 14px;

            color: #596573;

            margin-bottom: 16px;
        }


        .lineita {

            width: 65px;

            height: 2px;

            background:
                var(--rosa);

            margin:
                14px 0 16px 0;
        }


        .texto-info {

            font-size: 14px;

            line-height: 1.45;

            margin-bottom: 18px;
        }



        /* MENU */

        .menu {

            margin-top: 6px;

            padding:
                12px 12px 7px 12px;

            background:
                rgba(255,255,255,0.35);

            border:
                1px solid
                rgba(135,158,179,0.45);
        }


        .menu a {

            display: block;

            width: fit-content;

            margin-bottom: 8px;

            color:
                var(--azul-oscuro);

            text-decoration:
                underline;

            font-size: 14px;
        }


        .menu a::before {

            content: "♡ ";

            color:
                var(--rosa);
        }



        /* ACTUALIZACION */

        .actualizacion {

            margin-top: 22px;

            padding-top: 12px;

            border-top:
                1px solid
                rgba(75,96,125,0.22);

            font-size: 12px;

            color: #5c6673;
        }


        .firma {

            margin-top: 18px;

            font-size: 12px;

            color:
                var(--verde);

            letter-spacing: 1px;
        }



        /* ======================================== */
        /* FOTOS                                    */
        /* ======================================== */

        .fotos {

            position: relative;

            display: grid;

            grid-template-columns:
                repeat(6, minmax(0, 1fr));

            grid-template-rows:
                repeat(3, minmax(0, 1fr));

            gap: 7px;

            padding:
                49px 15px 13px 15px;

            min-width: 0;
            min-height: 0;

            background:

                linear-gradient(
                    to bottom,
                    rgba(166,183,199,0.11),
                    rgba(245,237,222,0.12)
                );

            border-bottom:
                4px solid
                var(--azul-oscuro);

            overflow: visible;
        }



        /* LINEA DECORATIVA */

        .fotos::before {

            content: "";

            position: absolute;

            left: 20px;
            right: 20px;
            top: 18px;

            height: 1px;

            background:

                repeating-linear-gradient(

                    to right,

                    rgba(141,154,120,0.65)
                    0 6px,

                    transparent
                    6px 12px

                );
        }



        /* TITULO */

        .titulo-fotos {

            position: absolute;

            top: 25px;
            left: 24px;

            font-size: 16px;

            letter-spacing: 1px;

            color:
                var(--azul-oscuro);

            background:
                rgba(252,250,246,0.90);

            padding-right: 7px;

            z-index: 10;
        }


        .titulo-fotos::after {

            content: "  ♡";

            color:
                var(--rosa);
        }



        /* CADA FOTO */

        .foto {

            position: relative;

            min-width: 0;
            min-height: 0;

            width: 100%;
            height: 100%;

            padding: 3px;

            background:
                var(--blanco);

            border:
                2px solid
                var(--azul-oscuro);

            box-shadow:

                0 2px 5px
                rgba(75,96,125,0.13);

            cursor: pointer;

            overflow: hidden;

            transition:

                transform 0.20s ease,
                box-shadow 0.20s ease;

            z-index: 1;
        }


        .foto img {

            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            object-position: center;
        }



        /* ======================================== */
        /* FOTO GRANDE AL PASAR EL MOUSE            */
        /* ======================================== */

        .foto:hover {

            transform:
                scale(2);

            z-index: 100;

            box-shadow:

                0 10px 30px
                rgba(75,96,125,0.38);

            border:
                2px solid
                var(--azul-oscuro);
        }



        /*
           Las fotos de los bordes crecen
           hacia ADENTRO de la página.
        */


        /* primera columna */

        .foto:nth-child(6n + 2) {

            transform-origin:
                left center;
        }


        /* ultima columna */

        .foto:nth-child(6n + 1) {

            transform-origin:
                right center;
        }



        /* ======================================== */
        /* PARTE INFERIOR                           */
        /* ======================================== */

        .abajo {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            min-width: 0;
            min-height: 0;

            height: 100%;
        }



        /* ======================================== */
        /* MUSICA                                   */
        /* ======================================== */

        .musica,
        .guestbook {

            min-width: 0;
            min-height: 0;

            padding:
                20px 22px 18px 22px;

            background:
                rgba(245,237,222,0.28);

            position: relative;

            overflow: hidden;
        }


        .musica {

            border-right:
                4px solid
                var(--azul-oscuro);
        }


        .musica::before,
        .guestbook::before {

            content: "";

            position: absolute;

            top: 11px;
            left: 15px;
            right: 15px;

            height: 1px;

            background:

                linear-gradient(

                    to right,

                    rgba(216,161,169,0.4),

                    rgba(141,154,120,0.35),

                    rgba(216,161,169,0.4)

                );
        }



        /* TITULOS INFERIORES */

        .musica h2,
        .guestbook h2 {

            margin:
                2px 0 10px 0;

            font-size: 16px;

            font-weight: normal;

            letter-spacing: 1px;

            color:
                var(--azul-oscuro);
        }


        .musica h2::after,
        .guestbook h2::after {

            content: "  ♡";

            color:
                var(--rosa);

            font-size: 14px;
        }



        /* ======================================== */
        /* SOUNDCLOUD                               */
        /* ======================================== */

        .reproductor {

            width: 100%;

            height:
                calc(100% - 30px);

            padding: 7px;

            border:
                2px solid
                var(--azul-medio);

            background:

                linear-gradient(

                    to bottom,

                    rgba(166,183,199,0.18),

                    rgba(245,237,222,0.20)

                );

            overflow: hidden;
        }


        .reproductor iframe {

            display: block;

            width: 100%;
            height: 100%;

            border: 0;
        }



        /* ======================================== */
        /* LIBRO DE QUEJAS                          */
        /* ======================================== */

        .mensajes {

            width: 100%;

            height:
                calc(100% - 30px);

            padding: 18px;

            border:
                2px solid
                var(--azul-medio);

            background:

                linear-gradient(

                    to bottom,

                    rgba(237,212,215,0.14),

                    rgba(245,237,222,0.18)

                );

            font-size: 14px;

            line-height: 1.5;

            position: relative;
        }


        .mensajes::after {

            content: "✿";

            position: absolute;

            right: 10px;
            bottom: 7px;

            font-size: 14px;

            color:
                rgba(141,154,120,0.65);
        }



        /* ======================================== */
        /* PANTALLAS MAS CHICAS                     */
        /* ======================================== */

        @media
        (max-width: 900px) {

            .estructura {

                grid-template-columns:
                    185px minmax(0,1fr);
            }


            .sidebar {

                padding:
                    24px 15px;
            }


            .menu {

                padding:
                    9px;
            }


            .fotos {

                gap: 5px;

                padding:
                    46px 10px 10px 10px;
            }


            .musica,
            .guestbook {

                padding:
                    18px 14px 12px 14px;
            }

        }



        /* ======================================== */
        /* CELULAR                                  */
        /* ======================================== */

        @media
        (max-width: 650px) {

            /*
                En teléfono permitimos scroll,
                porque meter las 18 fotos en una
                sola pantalla las haría ilegibles.
            */

            html,
            body {

                height: auto;

                overflow-y: auto;
            }


            body {

                display: block;
            }


            .pagina {

                width: 96%;

                height: auto;

                margin:
                    10px auto;

                overflow: hidden;
            }


            .estructura {

                display: block;

                height: auto;
            }


            .sidebar {

                border-right: none;

                border-bottom:
                    4px solid
                    var(--azul-oscuro);
            }


            .sidebar::after {

                display: none;
            }


            .fotos {

                min-height: auto;

                grid-template-columns:
                    repeat(2, 1fr);

                grid-template-rows:
                    none;

                padding:
                    52px 10px 12px 10px;

                overflow: hidden;
            }


            .foto {

                aspect-ratio:
                    1 / 1;
            }


            .foto:hover {

                transform:
                    scale(1.05);
            }


            .abajo {

                display: block;
            }


            .musica {

                border-right: none;

                border-bottom:
                    4px solid
                    var(--azul-oscuro);

                height: 260px;
            }


            .guestbook {

                height: 220px;
            }

        }

    </style>

</head>
