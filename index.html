<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CORAZÓN</title>

    <style>

        body {
            margin: 0;
            background: #dfe8f5;
            font-family: Arial, Helvetica, sans-serif;
            color: #111;
        }

        .barra {
            height: 70px;
            background: #3b5998;
            color: white;

            display: flex;
            align-items: center;

            padding-left: 30px;

            box-sizing: border-box;
        }

        .nombre {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .pagina {
            width: 90%;
            max-width: 1100px;

            margin: 30px auto;
        }

        .perfil {
            background: white;
            border: 1px solid #b7c4d6;

            padding: 20px;

            box-shadow: 0 1px 2px rgba(0,0,0,0.15);
        }

        .perfil h1 {
            margin: 0 0 5px 0;
            font-size: 28px;
        }

        .perfil p {
            margin: 0;
            color: #555;
        }

        .contenido {
            margin-top: 20px;

            background: white;
            border: 1px solid #b7c4d6;

            padding: 20px;
        }

        .titulo {
            font-size: 18px;
            font-weight: bold;

            border-bottom: 1px solid #ddd;

            padding-bottom: 10px;
            margin-bottom: 20px;
        }


        /* GALERÍA DE FOTOS */

        .galeria {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;

            position: relative;
        }

        .foto {
            width: 180px;
            position: relative;
        }

        .foto img {
            width: 100%;
            height: auto;

            display: block;

            border: 1px solid #777;

            cursor: pointer;

            transition: transform 0.2s ease;
        }

        .foto:hover {
            z-index: 100;
        }

        .foto:hover img {
            transform: scale(1.7);
        }


        /* SECCIÓN MÚSICA */

        .musica {
            margin-top: 20px;

            background: white;
            border: 1px solid #b7c4d6;

            padding: 20px;
        }

        .reproductor {
            background: #eeeeee;
            border: 1px solid #aaa;

            padding: 20px;

            font-size: 14px;
            color: #555;
        }


        /* GUESTBOOK */

        .guestbook {
            margin-top: 20px;

            background: white;
            border: 1px solid #b7c4d6;

            padding: 20px;
        }

        .muro {
            background: #f5f5f5;
            border: 1px dashed #999;

            padding: 20px;

            font-size: 14px;
            color: #555;
        }


        /* CELULAR */

        @media (max-width: 600px) {

            .barra {
                height: 60px;
                padding-left: 15px;
            }

            .nombre {
                font-size: 26px;
            }

            .pagina {
                width: 94%;
                margin: 15px auto;
            }

            .perfil,
            .contenido,
            .musica,
            .guestbook {
                padding: 15px;
            }

            .galeria {
                gap: 8px;
            }

            .foto {
                width: calc(50% - 4px);
            }

            .foto:hover img {
                transform: scale(1.2);
            }

        }

    </style>
</head>


<body>

    <div class="barra">

        <div class="nombre">
            CORAZÓN
        </div>

    </div>


    <div class="pagina">


        <!-- PERFIL -->

        <div class="perfil">

            <h1>corazón</h1>

            <p>
                banda de dream-pop crotoms
            </p>

        </div>



        <!-- FOTOS -->

        <div class="contenido">

            <div class="titulo">
                fotos
            </div>

            <div class="galeria">

                <div class="foto">

                    <img
                       src="fotos/P1010003.JPG" 
                        alt="corazón"
                    >

                </div>

            </div>

        </div>



        <!-- MÚSICA -->

        <div class="musica">

            <div class="titulo">
                música
            </div>

            <div class="reproductor">

                reproductor de SoundCloud próximamente...

            </div>

        </div>



        <!-- GUESTBOOK -->

        <div class="guestbook">

            <div class="titulo">
                guestbook
            </div>

            <div class="muro">

                próximamente vas a poder dejar un mensaje...

            </div>

        </div>


    </div>

</body>

</html>
