<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CORAZÓN</title>

    <style>

        body {
            margin: 0;
            background: #dfe8f5;
            font-family: "Times New Roman", Times, serif;
            color: #111;
        }

        .pagina {
            width: 95%;
            max-width: 1200px;
            margin: 20px auto;
            background: white;
            border: 1px solid #aeb8c7;
            min-height: 700px;
        }

        .estructura {
            display: grid;

            grid-template-columns: 220px 1fr;
            grid-template-rows: 430px 270px;

            min-height: 700px;
        }


        /* COLUMNA IZQUIERDA */

        .sidebar {
            grid-row: 1 / 3;

            border-right: 4px solid black;

            padding: 30px 20px;

            box-sizing: border-box;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;

            margin-bottom: 40px;
        }

        .sidebar p {
            font-size: 16px;
            line-height: 1.5;
        }

        .menu {
            margin-top: 30px;
        }

        .menu a {
            display: block;

            color: blue;
            text-decoration: underline;

            margin-bottom: 10px;
        }


        /* ZONA DE FOTOS */

        .fotos {
            position: relative;

            border-bottom: 4px solid black;

            overflow: visible;
        }

        .titulo-fotos {
            position: absolute;
            top: 20px;
            left: 30px;

            font-size: 18px;
        }


        /* FOTOS DE EJEMPLO */

        .foto {
            position: absolute;

            width: 120px;

            border: 4px solid black;

            background: white;

            padding: 4px;

            box-sizing: border-box;

            transition: transform 0.2s ease;

            cursor: pointer;
        }

        .foto img {
            width: 100%;
            display: block;
        }

        .foto:hover {
            transform: scale(1.6);
            z-index: 100;
        }


        /* POSICIONES DE EJEMPLO */

        .foto1 {
            top: 25px;
            left: 140px;
        }

        .foto2 {
            top: 40px;
            left: 270px;
        }

        .foto3 {
            top: 160px;
            left: 190px;
        }

        .foto4 {
            top: 220px;
            left: 420px;
        }

        .foto5 {
            top: 100px;
            left: 600px;
        }


        /* PARTE INFERIOR */

        .abajo {
            display: grid;

            grid-template-columns: 1fr 1fr;

            height: 100%;
        }


        /* MUSICA */

        .musica {
            border-right: 4px solid black;

            padding: 40px;

            box-sizing: border-box;
        }

        .musica h2 {
            font-size: 18px;

            margin-top: 0;
        }

        .reproductor {
            margin-top: 30px;

            border: 1px solid #777;

            background: #eee;

            padding: 20px;

            font-family: Arial, sans-serif;
            font-size: 14px;
        }


        /* GUESTBOOK */

        .guestbook {
            padding: 40px;

            box-sizing: border-box;
        }

        .guestbook h2 {
            font-size: 18px;

            margin-top: 0;
        }

        .mensajes {
            margin-top: 30px;

            border: 1px dashed #777;

            padding: 20px;

            min-height: 100px;
        }


        /* CELULAR */

        @media (max-width: 700px) {

            .pagina {
                width: 96%;
                margin: 10px auto;
            }

            .estructura {
                display: block;
            }

            .sidebar {
                border-right: none;
                border-bottom: 4px solid black;

                padding: 20px;
            }

            .fotos {
                min-height: 500px;

                border-bottom: 4px solid black;
            }

            .abajo {
                display: block;
            }

            .musica {
                border-right: none;
                border-bottom: 4px solid black;
            }

            .foto:hover {
                transform: scale(1.2);
            }

        }

    </style>
</head>


<body>

    <div class="pagina">

        <div class="estructura">


            <!-- COLUMNA IZQUIERDA -->

            <aside class="sidebar">

                <div class="logo">
                    CORAZÓN
                </div>

                <p>
                    banda de dream-pop
                </p>

                <p>
                    villa maría, argentina
                </p>

                <div class="menu">

                    <a href="#">inicio</a>

                    <a href="#">fotos</a>

                    <a href="#">música</a>

                    <a href="#">guestbook</a>

                    <a href="#">contacto</a>

                </div>

                <p style="margin-top:40px; font-size:13px;">
                    última actualización:<br>
                    16.09.2026
                </p>

            </aside>



            <!-- ZONA DE FOTOS -->

            <section class="fotos">

                <div class="titulo-fotos">
                    fotos
                </div>


                <div class="foto foto1">
                    foto
                </div>

                <div class="foto foto2">
                    foto
                </div>

                <div class="foto foto3">
                    foto
                </div>

                <div class="foto foto4">
                    foto
                </div>

                <div class="foto foto5">
                    foto
                </div>

            </section>



            <!-- PARTE INFERIOR -->

            <section class="abajo">


                <!-- MUSICA -->

                <div class="musica">

                    <h2>
                        música
                    </h2>

                    <div class="reproductor">

                        reproductor de SoundCloud / Spotify próximamente

                    </div>

                </div>



                <!-- GUESTBOOK -->

                <div class="guestbook">

                    <h2>
                        guestbook
                    </h2>

                    <div class="mensajes">

                        próximamente vas a poder dejar mensajes acá...

                    </div>

                </div>


            </section>


        </div>

    </div>

</body>

</html>
