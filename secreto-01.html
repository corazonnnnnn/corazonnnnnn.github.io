<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>archivo desconocido</title>

    <link
        rel="icon"
        type="image/svg+xml"
        href="favicon.svg"
    >

    <style>

        :root {

            --azul-suave: #a6b7c7;
            --azul-medio: #879eb3;
            --azul-oscuro: #4b607d;

            --crema: #f5edde;
            --beige: #eadfce;

            --rosa: #d8a1a9;
            --verde: #8d9a78;

            --texto: #2e3440;
        }


        * {
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            min-height: 100%;

            margin: 0;
        }


        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            color:
                var(--texto);

            font-family:
                "Courier New",
                monospace;

            background-color:
                var(--beige);

            background-image:
                url("fondo-floral.jpg");

            background-size:
                cover;

            background-position:
                center;

            background-repeat:
                no-repeat;

            background-attachment:
                fixed;
        }



        /* CAJA PRINCIPAL */

        .archivo {

            width:
                min(650px, 100%);

            background:
                rgba(234,223,206,0.96);

            border:
                1px solid
                var(--azul-medio);

            box-shadow:
                0 5px 20px
                rgba(75,96,125,0.24);

            padding:
                42px;

            position:
                relative;

            text-align:
                left;
        }


        .archivo::before {

            content: "";

            position:
                absolute;

            inset:
                8px;

            border:
                1px solid
                rgba(75,96,125,0.22);

            pointer-events:
                none;
        }


        .archivo::after {

            content: "";

            position:
                absolute;

            inset:
                15px;

            border:
                1px dotted
                rgba(216,161,169,0.40);

            pointer-events:
                none;
        }



        .contenido {

            position:
                relative;

            z-index:
                2;
        }



        .ruta {

            font-size:
                11px;

            color:
                var(--verde);

            margin-bottom:
                30px;
        }



        .titulo {

            font-size:
                clamp(20px,4vw,30px);

            color:
                var(--azul-oscuro);

            margin-bottom:
                20px;

            letter-spacing:
                2px;
        }



        .linea {

            color:
                var(--rosa);

            margin:
                12px 0;
        }



        .texto {

            font-size:
                13px;

            line-height:
                1.7;

            color:
                #596573;

            margin-bottom:
                30px;
        }



        .archivo-encontrado {

            border:
                1px dashed
                var(--azul-medio);

            background:
                rgba(245,237,222,0.55);

            padding:
                16px;

            margin-bottom:
                25px;

            font-size:
                12px;
        }



        .archivo-encontrado span {

            color:
                var(--rosa);
        }



        .seguir {

            display:
                inline-block;

            color:
                var(--azul-oscuro);

            font-size:
                13px;

            text-decoration:
                underline;

            padding:
                7px 0;
        }


        .seguir::before {

            content:
                "> ";
            color:
                var(--rosa);
        }


        .seguir:hover {

            color:
                var(--rosa);
        }



        .salir {

            display:
                block;

            width:
                fit-content;

            margin-top:
                30px;

            font-size:
                10px;

            color:
                var(--verde);

            text-decoration:
                none;
        }


        .salir:hover {

            text-decoration:
                underline;
        }



        /* CURSOR */

        .cursor-corazon {

            display:
                none;
        }


        @media (pointer:fine) {

            body,
            a {

                cursor:
                    none !important;
            }


            .cursor-corazon {

                display:
                    block;

                position:
                    fixed;

                width:
                    28px;

                height:
                    28px;

                left:
                    0;

                top:
                    0;

                pointer-events:
                    none;

                z-index:
                    999999;

                transform:
                    translate(-4px,-4px);

                image-rendering:
                    pixelated;
            }


            .cursor-corazon svg {

                width:
                    100%;

                height:
                    100%;

                display:
                    block;
            }


            .estela-cursor {

                position:
                    fixed;

                width:
                    6px;

                height:
                    6px;

                pointer-events:
                    none;

                z-index:
                    999998;

                animation:
                    desaparecer
                    .7s linear forwards;
            }


            @keyframes desaparecer {

                0% {

                    opacity:
                        .95;
                }


                100% {

                    opacity:
                        0;

                    transform:
                        translateY(12px)
                        scale(.3);
                }

            }

        }



        @media (max-width:600px) {

            .archivo {

                padding:
                    34px 25px;
            }

        }

    </style>

</head>


<body>



<div class="archivo">


    <div class="contenido">


        <div class="ruta">
            C:\corazon\archivos_locales\???
        </div>


        <div class="titulo">
            [ directorio desconocido ]
        </div>


        <div class="linea">
            +----------------------------------+
        </div>


        <div class="texto">

            esta carpeta no debería estar acá.

            <br><br>

            probablemente no tenga nada importante.

            <br>

            probablemente.

        </div>



        <div class="archivo-encontrado">

            archivo encontrado:

            <br><br>

            <span>
                carpeta_004/
            </span>

        </div>



        <a
            class="seguir"
            href="secreto-02.html"
        >
            abrir carpeta
        </a>



        <a
            class="salir"
            href="index.html"
        >
            [ volver al home ]
        </a>


    </div>


</div>



<!-- CURSOR -->

<div
    class="cursor-corazon"
    id="cursorCorazon"
>

    <svg
        viewBox="0 0 8 8"
        xmlns="http://www.w3.org/2000/svg"
        shape-rendering="crispEdges"
    >

        <rect x="1" y="1" width="2" height="1" fill="#d8a1a9"/>
        <rect x="5" y="1" width="2" height="1" fill="#d8a1a9"/>

        <rect x="0" y="2" width="8" height="2" fill="#d8a1a9"/>

        <rect x="1" y="4" width="6" height="1" fill="#d8a1a9"/>
        <rect x="2" y="5" width="4" height="1" fill="#d8a1a9"/>
        <rect x="3" y="6" width="2" height="1" fill="#d8a1a9"/>

        <rect x="1" y="2" width="1" height="1" fill="#f5edde"/>

        <rect x="1" y="0" width="2" height="1" fill="#4b607d"/>
        <rect x="5" y="0" width="2" height="1" fill="#4b607d"/>

        <rect x="0" y="1" width="1" height="1" fill="#4b607d"/>
        <rect x="3" y="1" width="2" height="1" fill="#4b607d"/>
        <rect x="7" y="1" width="1" height="1" fill="#4b607d"/>

        <rect x="0" y="4" width="1" height="1" fill="#4b607d"/>
        <rect x="7" y="4" width="1" height="1" fill="#4b607d"/>

        <rect x="1" y="5" width="1" height="1" fill="#4b607d"/>
        <rect x="6" y="5" width="1" height="1" fill="#4b607d"/>

        <rect x="2" y="6" width="1" height="1" fill="#4b607d"/>
        <rect x="5" y="6" width="1" height="1" fill="#4b607d"/>

        <rect x="3" y="7" width="2" height="1" fill="#4b607d"/>

    </svg>

</div>



<script>

    const cursorCorazon =
        document.getElementById(
            "cursorCorazon"
        );


    const coloresEstela = [

        "#d8a1a9",
        "#879eb3",
        "#8d9a78",
        "#f5edde",
        "#a6b7c7"

    ];


    let ultimoRastro =
        0;



    document.addEventListener(

        "mousemove",

        evento => {


            cursorCorazon.style.left =
                evento.clientX +
                "px";


            cursorCorazon.style.top =
                evento.clientY +
                "px";


            const ahora =
                Date.now();


            if (
                ahora -
                ultimoRastro <
                35
            ) {

                return;
            }


            ultimoRastro =
                ahora;


            const pixel =
                document.createElement(
                    "div"
                );


            pixel.className =
                "estela-cursor";


            pixel.style.left =
                evento.clientX +
                "px";


            pixel.style.top =
                evento.clientY +
                "px";


            pixel.style.background =
                coloresEstela[
                    Math.floor(
                        Math.random() *
                        coloresEstela.length
                    )
                ];


            document.body.appendChild(
                pixel
            );


            setTimeout(

                () => {

                    pixel.remove();

                },

                700

            );

        }

    );


</script>


</body>

</html>
