<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>404?</title>

    <link
        rel="icon"
        type="image/svg+xml"
        href="favicon.svg"
    >

    <style>

        :root {

            --azul-suave: #a6b7c7;
            --azul-medio: #879eb3;
            --azul-oscuro: #4b607d;

            --crema: #f5edde;
            --beige: #eadfce;

            --rosa: #d8a1a9;
            --verde: #8d9a78;

            --texto: #2e3440;
        }


        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            width: 100%;
            min-height: 100%;
        }


        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            font-family:
                "Courier New",
                monospace;

            color:
                var(--texto);

            background-color:
                var(--beige);

            background-image:
                url("fondo-floral.jpg");

            background-size:
                cover;

            background-position:
                center;

            background-repeat:
                no-repeat;

            background-attachment:
                fixed;
        }



        /* ===================================== */
        /* CAJA                                  */
        /* ===================================== */

        .error-box {

            width:
                min(700px, 100%);

            background:
                rgba(234,223,206,0.97);

            border:
                1px solid
                var(--azul-medio);

            box-shadow:
                0 5px 20px
                rgba(75,96,125,0.24);

            padding:
                42px;

            position:
                relative;

            text-align:
                center;
        }


        .error-box::before {

            content: "";

            position:
                absolute;

            inset:
                8px;

            border:
                1px solid
                rgba(75,96,125,0.22);

            pointer-events:
                none;
        }


        .error-box::after {

            content: "";

            position:
                absolute;

            inset:
                15px;

            border:
                1px dotted
                rgba(216,161,169,0.40);

            pointer-events:
                none;
        }


        .contenido {

            position:
                relative;

            z-index:
                2;
        }



        /* ===================================== */
        /* ERROR                                 */
        /* ===================================== */

        .codigo {

            font-size:
                clamp(70px, 14vw, 150px);

            line-height:
                .9;

            font-weight:
                bold;

            color:
                var(--azul-oscuro);

            letter-spacing:
                -8px;

            margin-bottom:
                12px;
        }


        .titulo {

            font-size:
                clamp(18px,3vw,27px);

            color:
                var(--rosa);

            letter-spacing:
                3px;

            margin-bottom:
                22px;
        }


        .linea {

            color:
                var(--verde);

            font-size:
                11px;

            margin:
                16px 0;
        }


        .mensaje {

            font-size:
                13px;

            line-height:
                1.8;

            color:
                #596573;

            margin:
                25px auto;

            max-width:
                500px;
        }


        .mentira {

            opacity:
                0;

            color:
                var(--rosa);

            font-size:
                12px;

            margin-top:
                20px;

            animation:
                aparecer
                2s ease forwards;

            animation-delay:
                1.5s;
        }


        @keyframes aparecer {

            to {
                opacity: 1;
            }

        }



        /* ===================================== */
        /* BOTONES                               */
        /* ===================================== */

        .acciones {

            margin-top:
                30px;

            display:
                flex;

            justify-content:
                center;

            gap:
                12px;

            flex-wrap:
                wrap;
        }


        .acciones a {

            display:
                inline-block;

            padding:
                8px 12px;

            border:
                1px solid
                var(--azul-medio);

            background:
                rgba(245,237,222,0.65);

            color:
                var(--azul-oscuro);

            font-size:
                11px;

            text-decoration:
                none;
        }


        .acciones a:hover {

            background:
                var(--rosa);

            color:
                var(--crema);
        }


        .acciones a::before {

            content:
                "[ ";
        }


        .acciones a::after {

            content:
                " ]";
        }


        .seguir {

            animation:
                parpadeo
                1.2s steps(2,end)
                infinite;
        }


        @keyframes parpadeo {

            50% {
                opacity: .55;
            }

        }



        /* ===================================== */
        /* CURSOR                                */
        /* ===================================== */

        .cursor-corazon {

            display:
                none;
        }


        @media (pointer:fine) {

            body,
            a {

                cursor:
                    none !important;
            }


            .cursor-corazon {

                display:
                    block;

                position:
                    fixed;

                width:
                    28px;

                height:
                    28px;

                left:
                    0;

                top:
                    0;

                pointer-events:
                    none;

                z-index:
                    999999;

                transform:
                    translate(-4px,-4px);
            }


            .cursor-corazon svg {

                display:
                    block;

                width:
                    100%;

                height:
                    100%;
            }


            .estela-cursor {

                position:
                    fixed;

                width:
                    6px;

                height:
                    6px;

                pointer-events:
                    none;

                z-index:
                    999998;

                animation:
                    desaparecer
                    .7s linear forwards;
            }


            @keyframes desaparecer {

                0% {
                    opacity: .95;
                }


                100% {

                    opacity: 0;

                    transform:
                        translateY(12px)
                        scale(.3);
                }

            }

        }



        /* ===================================== */
        /* CELULAR                               */
        /* ===================================== */

        @media
        (max-width:600px) {

            .error-box {

                padding:
                    34px 22px;
            }


            .codigo {

                letter-spacing:
                    -4px;
            }

        }

    </style>

</head>


<body>


<div class="error-box">

    <div class="contenido">


        <div class="codigo">
            404
        </div>


        <div class="titulo">
            ARCHIVO NO ENCONTRADO
        </div>


        <div class="linea">
            ------------------------------------------------
        </div>


        <div class="mensaje">

            el archivo que intentabas abrir no existe.

            <br><br>

            puede haber sido eliminado,

            <br>

            movido,

            <br>

            o quizás nunca estuvo acá.

        </div>


        <div class="mentira">
            mentira.
        </div>


        <div class="acciones">


            <a
                href="index.html"
            >
                volver al home
            </a>


            <a
                class="seguir"
                href="secreto-04.html"
            >
                intentar de nuevo
            </a>


        </div>


    </div>

</div>



<!-- CURSOR -->

<div
    class="cursor-corazon"
    id="cursorCorazon"
>

    <svg
        viewBox="0 0 8 8"
        xmlns="http://www.w3.org/2000/svg"
        shape-rendering="crispEdges"
    >

        <rect x="1" y="1" width="2" height="1" fill="#d8a1a9"/>
        <rect x="5" y="1" width="2" height="1" fill="#d8a1a9"/>

        <rect x="0" y="2" width="8" height="2" fill="#d8a1a9"/>

        <rect x="1" y="4" width="6" height="1" fill="#d8a1a9"/>
        <rect x="2" y="5" width="4" height="1" fill="#d8a1a9"/>
        <rect x="3" y="6" width="2" height="1" fill="#d8a1a9"/>

        <rect x="1" y="2" width="1" height="1" fill="#f5edde"/>

        <rect x="1" y="0" width="2" height="1" fill="#4b607d"/>
        <rect x="5" y="0" width="2" height="1" fill="#4b607d"/>

        <rect x="0" y="1" width="1" height="1" fill="#4b607d"/>
        <rect x="3" y="1" width="2" height="1" fill="#4b607d"/>
        <rect x="7" y="1" width="1" height="1" fill="#4b607d"/>

        <rect x="0" y="4" width="1" height="1" fill="#4b607d"/>
        <rect x="7" y="4" width="1" height="1" fill="#4b607d"/>

        <rect x="1" y="5" width="1" height="1" fill="#4b607d"/>
        <rect x="6" y="5" width="1" height="1" fill="#4b607d"/>

        <rect x="2" y="6" width="1" height="1" fill="#4b607d"/>
        <rect x="5" y="6" width="1" height="1" fill="#4b607d"/>

        <rect x="3" y="7" width="2" height="1" fill="#4b607d"/>

    </svg>

</div>



<script>

    const cursorCorazon =
        document.getElementById(
            "cursorCorazon"
        );


    const coloresEstela = [

        "#d8a1a9",
        "#879eb3",
        "#8d9a78",
        "#f5edde",
        "#a6b7c7"

    ];


    let ultimoRastro =
        0;



    document.addEventListener(

        "mousemove",

        evento => {


            cursorCorazon.style.left =
                evento.clientX +
                "px";


            cursorCorazon.style.top =
                evento.clientY +
                "px";


            const ahora =
                Date.now();


            if (
                ahora -
                ultimoRastro <
                35
            ) {

                return;
            }


            ultimoRastro =
                ahora;


            const pixel =
                document.createElement(
                    "div"
                );


            pixel.className =
                "estela-cursor";


            pixel.style.left =
                evento.clientX +
                "px";


            pixel.style.top =
                evento.clientY +
                "px";


            pixel.style.background =
                coloresEstela[
                    Math.floor(
                        Math.random() *
                        coloresEstela.length
                    )
                ];


            document.body.appendChild(
                pixel
            );


            setTimeout(

                () => {

                    pixel.remove();

                },

                700

            );

        }

    );


</script>


</body>

</html>
